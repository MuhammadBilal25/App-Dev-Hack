services:
  api:
    build: .
    ports:
      - "8080:8080"
    networks:
      default:
        # Selenium browser nodes reach the Guest Web Player at http://backend:8080 (spec 6.2.1).
        aliases: [backend]
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: "8080"
      DATABASE_URL: postgres://nascon:nascon@postgres:5432/nascon
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nascon-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-nascon}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-nascon-minio-secret}
      # Day 2: MediaMTX control API (kick revoked publishers, bitrate) and shared recordings.
      MEDIA_API_URL: http://mediamtx:9997
      RECORDINGS_DIR: /recordings
    volumes:
      - recordings:/recordings:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Image uploads wait for MinIO in the background; /health never depends on it.
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Self-hosted S3-compatible object store for product images and logos. Not exposed on the
  # host: the API streams images to clients through GET /media/{key}.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nascon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nascon-minio-secret}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ---------------------------------------------------------------- Day 2 ----
  # Self-hosted media server: RTMP 1935, HLS 8888, WebRTC WHIP/WHEP 8889 (+ 8189 ICE).
  # Asks the API to authorise every publish/read, records to the shared volume.
  mediamtx:
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "8189:8189/tcp"
    volumes:
      - ./scenario2/media/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9997/v3/config/global/get"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Selenium Grid 4: hub on 4444 + 3 browser nodes (spec 6.2.1). shm_size stops browser OOM
  # crashes on 8 GB runners; VNC is off to save memory.
  selenium-hub:
    image: selenium/hub:4.25.0
    container_name: nascon-selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 5s
      timeout: 5s
      retries: 30

  node-chrome-1:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5555/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  node-chrome-2:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5555/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  node-firefox:
    image: selenium/node-firefox:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5555/status"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  minio-data:
  recordings:
